name: Publish Fall 2026 catalogue

on:
  # GitHub may delay scheduled jobs; 22:03:09 UTC is a MINIMUM, not an exact trigger.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: progressive-medals-fall-2026
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generation and publisher without network
        run: python -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Gate UTC publication and immutable output
        id: gate
        shell: bash
        run: |
          if [ -f docs/catalogue.json ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            echo 'A versioned catalogue already exists; never recalculate the frozen WRs.'
          elif [ "$(date -u +%s)" -lt 1791928989 ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Waiting for Fall 2026 common T0 + 1 hour.'
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Capture 25 WR snapshots and build version 3
        if: steps.gate.outputs.publish == 'true'
        run: python -B tools/publish_fall_2026.py --publish --output docs/catalogue.json
      - name: Commit the immutable catalogue and source evidence
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          git add docs/catalogue.json docs/catalogue.evidence.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Fall 2026 medals catalogue v3'
          git push origin HEAD:main
      - name: Configure GitHub Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload only public site files
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy or retry GitHub Pages
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
